<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Respostas para o Teams | Hub Inútil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="hub-bar.js" defer></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .teams-purple { background-color: #5B5FC7; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 min-h-screen flex flex-col items-center p-6">
    <main class="max-w-2xl w-full bg-white border border-gray-200 rounded-xl p-8 shadow-sm flex flex-col">
        <div class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-black tracking-tight text-gray-800 mb-2 flex justify-center items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="#5B5FC7" aria-hidden="true">
                    <path d="M16 16c0-4.418-3.582-8-8-8s-8 3.582-8 8 3.582 8 8 8 8-3.582 8-8zm-6-2v4h-4v-4h4zm14-1v9c0 1.104-.896 2-2 2h-4v-4h-4v4h-2c-1.104 0-2-.896-2-2v-9c0-1.104.896-2 2-2h10c1.104 0 2 .896 2 2zm-8 4v-2h4v2h-4zm-8-15c-2.761 0-5 2.239-5 5s2.239 5 5 5 5-2.239 5-5-2.239-5-5-5zm12 0c-2.209 0-4 1.791-4 4s1.791 4 4 4 4-1.791 4-4-1.791-4-4-4z"/>
                </svg>
                Fugindo do Chefe
            </h1>
            <p class="text-gray-500">
                Gere respostas evasivas e corporativas para ganhar tempo quando te pedirem aquele relatório que você nem começou.
            </p>
        </div>

        <button id="btn-gerar" type="button" class="w-full py-4 teams-purple text-white font-bold text-lg rounded-lg hover:bg-[#464EB8] focus:outline-none focus:ring-2 focus:ring-[#5B5FC7] focus:ring-offset-2 transition-colors shadow-md mb-8 flex justify-center items-center gap-2">
            Gerar Desculpa Corporativa
        </button>

        <div class="border border-gray-200 rounded-lg p-4 bg-gray-50">
            <div class="flex gap-4">
                <div class="w-10 h-10 rounded-full teams-purple flex items-center justify-center text-white font-bold flex-shrink-0" aria-hidden="true">
                    VC
                </div>
                <div class="flex-grow">
                    <div class="flex items-baseline gap-2 mb-1">
                        <span class="font-bold text-gray-800">Você</span>
                        <span class="text-xs text-gray-500">Agora mesmo</span>
                    </div>
                    <div id="texto-resposta" class="text-gray-700 leading-relaxed text-sm" aria-live="polite">
                        Clique no botão acima para gerar sua rota de fuga.
                    </div>
                </div>
            </div>

            <div class="mt-4 pt-4 border-t border-gray-200 flex justify-end">
                <button id="btn-copiar" type="button" disabled class="px-4 py-2 bg-white border border-gray-300 text-gray-700 font-bold text-sm rounded-lg hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-300 transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2m-6 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-8a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z"/>
                    </svg>
                    Copiar resposta
                </button>
            </div>
            <p id="status-copia" class="mt-3 text-right text-xs text-gray-500" role="status" aria-live="polite"></p>
        </div>
    </main>

    <script>
        const btnGerar = document.getElementById('btn-gerar');
        const btnCopiar = document.getElementById('btn-copiar');
        const textoResposta = document.getElementById('texto-resposta');
        const statusCopia = document.getElementById('status-copia');

        const respostas = [
            'Estou finalizando os últimos alinhamentos e compartilho uma atualização assim que tudo estiver consolidado.',
            'O material está em revisão para garantir que todos os pontos estejam contemplados. Volto com novidades em breve.',
            'Estou cruzando algumas informações antes de fechar a versão final. Assim evitamos retrabalho — ou pelo menos mudamos o nome dele.',
            'A demanda está no meu radar e avançando conforme as prioridades estratégicas permitem.',
            'Estou aguardando um retorno importante para concluir. Não posso dizer de quem, mas envolve um e-mail que ainda não enviei.',
            'Já tenho um rascunho bem encaminhado; agora estou trabalhando na parte de fazer parecer que estava planejado.',
            'Estou validando os dados com as áreas envolvidas. Se alguma área responder, aviso por aqui.',
            'A entrega está passando por uma última rodada de refinamento. O refinamento, no caso, é descobrir onde salvei o arquivo.',
            'Estou estruturando os próximos passos e alinhando expectativas sobre o prazo dos próximos passos.',
            'O relatório está quase pronto para entrar na etapa anterior à etapa final.'
        ];

        let ultimaResposta = '';

        btnGerar.addEventListener('click', () => {
            const opcoes = respostas.filter(resposta => resposta !== ultimaResposta);
            ultimaResposta = opcoes[Math.floor(Math.random() * opcoes.length)];
            textoResposta.textContent = ultimaResposta;
            btnCopiar.disabled = false;
            statusCopia.textContent = '';
        });

        btnCopiar.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(textoResposta.textContent);
                statusCopia.textContent = 'Resposta copiada.';
            } catch (error) {
                console.error('Erro ao copiar a resposta:', error);
                statusCopia.textContent = 'Não foi possível copiar. Verifique a permissão do navegador.';
            }
        });
    </script>
</body>
</html>
