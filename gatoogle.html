<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatoogle | Hub Inútil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="hub-bar.js" defer></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col items-center justify-center p-6">
    <main class="max-w-2xl w-full bg-white border-2 border-gray-200 rounded-xl p-8 md:p-12 shadow-sm text-center">
        <h1 class="text-4xl md:text-5xl font-black tracking-tighter text-orange-600 mb-4">Gatoogle</h1>
        <p class="text-lg text-gray-600 mb-8">O gato sabe o que procurar. Provavelmente.</p>

        <div class="space-y-4">
            <label for="busca-gato" class="sr-only">Busca escrita pelo gato</label>
            <input id="busca-gato" type="text" readonly aria-live="polite" class="w-full px-4 py-4 bg-gray-50 border-2 border-gray-200 rounded-lg text-xl font-mono text-center" placeholder="O teclado aguarda as patas...">
            <button id="btn-gato" type="button" class="w-full px-8 py-4 bg-orange-600 text-white font-bold text-lg uppercase tracking-widest rounded-lg hover:bg-orange-700 transition-colors shadow-lg">
                Deixar o gato escrever
            </button>
            <p id="status-gato" class="min-h-6 text-sm text-gray-500" role="status" aria-live="polite"></p>
        </div>

        <p class="mt-6 text-xs text-gray-500">Busca gerada por um gato. O resultado é de responsabilidade dele.</p>
    </main>

    <script>
        const searchField = document.getElementById('busca-gato');
        const writeButton = document.getElementById('btn-gato');
        const statusMessage = document.getElementById('status-gato');
        const letters = 'abcdefghijklmnopqrstuvwxyzáàâãäåæçéèêëíìîïñóòôõöøúùûüýÿ';
        const punctuation = '?!.,';
        let typingTimer;
        let searchTimer;

        function randomInteger(minimum, maximum) {
            return Math.floor(Math.random() * (maximum - minimum + 1)) + minimum;
        }

        function generateCatSearch() {
            const targetLength = randomInteger(6, 15);
            let result = '';

            while (result.length < targetLength) {
                const letter = letters[randomInteger(0, letters.length - 1)];
                const runLength = Math.min(randomInteger(2, 4), targetLength - result.length);
                result += letter.repeat(runLength);
            }

            const characters = result.split('');
            if (Math.random() < 0.18) {
                const position = randomInteger(1, characters.length - 2);
                characters[position] = ' ';
            }
            if (Math.random() < 0.08) {
                const position = randomInteger(0, characters.length - 1);
                characters[position] = punctuation[randomInteger(0, punctuation.length - 1)];
            }
            return characters.join('');
        }

        writeButton.addEventListener('click', () => {
            clearTimeout(typingTimer);
            clearTimeout(searchTimer);

            const searchText = generateCatSearch();
            const searchTab = window.open('about:blank', '_blank');
            if (searchTab) {
                searchTab.opener = null;
            }

            searchField.value = '';
            statusMessage.textContent = '';
            writeButton.disabled = true;
            writeButton.classList.add('opacity-60', 'cursor-wait');

            let index = 0;
            function typeNextCharacter() {
                searchField.value += searchText[index];
                index += 1;

                if (index < searchText.length) {
                    typingTimer = setTimeout(typeNextCharacter, randomInteger(80, 200));
                    return;
                }

                searchTimer = setTimeout(() => {
                    const searchUrl = `https://www.google.com/search?q=${encodeURIComponent(searchText)}`;
                    writeButton.disabled = false;
                    writeButton.classList.remove('opacity-60', 'cursor-wait');

                    try {
                        if (searchTab && !searchTab.closed) {
                            searchTab.location.href = searchUrl;
                            return;
                        }

                        const searchLink = document.createElement('a');
                        searchLink.href = searchUrl;
                        searchLink.target = '_blank';
                        searchLink.rel = 'noopener noreferrer';
                        searchLink.click();
                        statusMessage.textContent = 'O navegador pode bloquear a nova aba. Permita pop-ups para abrir a busca.';
                    } catch {
                        statusMessage.textContent = 'Não foi possível abrir a busca neste navegador.';
                    }
                }, 1200);
            }

            typeNextCharacter();
        });
    </script>
</body>
</html>
